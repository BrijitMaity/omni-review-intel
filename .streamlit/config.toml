[theme]
base = "light"
primaryColor = "#F97316"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#F1F5F9"
textColor = "#0F172A"
font = "sans serif"

[server]
headless = true
websocketPingInterval = 25
disconnectedSessionTTL = 300

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
